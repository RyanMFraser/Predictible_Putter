; Predictible Putter — firmware (PlatformIO + Arduino-ESP32)
; Spec 0001 §8 Q5: framework = PlatformIO + Arduino.
; Board: generic ESP32-WROOM-32 DevKit -> "esp32dev".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; High baud so 1 kHz of CSV samples fits over USB serial (Slice 1 bring-up).
; Match this in the serial monitor / desktop reader.
monitor_speed = 921600
build_flags = -DPUTTER_SERIAL_BAUD=921600
